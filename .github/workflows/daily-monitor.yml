name: 每日廣告監控

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行廣告監控
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: |
          python meta_ads_monitor/run_ci.py

      - name: 把報告存回 repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add meta_ads_monitor/reports/latest.json
          git add meta_ads_monitor/follows_snapshot.json
          git diff --staged --quiet || git commit -m "📊 每日報告 $(date -u '+%Y-%m-%d')"
          git push

      - name: 上傳 dashboard 到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
