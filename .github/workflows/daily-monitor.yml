name: 每日廣告監控

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行廣告監控
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: |
          python meta_ads_monitor/run_ci.py

      - name: 把報告存回 repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git stash -u
          git pull --rebase origin main
          git stash pop
          git add meta_ads_monitor/reports/latest.json
          git add meta_ads_monitor/follows_snapshot.json
          git diff --staged --quiet || git commit -m "📊 每日報告 $(date -u '+%Y-%m-%d')"
          git push

      - name: 上傳 dashboard 到主機
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 45.130.228.43
          username: u420995027.empower-biz.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dashboard/
          server-dir: public_html/AI-Project/ads-dashboard/
